<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>音楽制作ポートフォリオ</title>

<style>
body {
  margin: 0;
  padding: 40px 20px;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
}

h1 {
  font-size: 20px;
  text-align: center;
  margin-bottom: 60px;
}

.track {
  margin-bottom: 35px;
}

.track-name {
  font-size: 16px;
  margin-bottom: 10px;
}

audio {
  width: 100%;
}
</style>
</head>

<body>
<main>

<h1>音楽制作ポートフォリオ</h1>

<div class="track">
  <div class="track-name">曲名01</div>
  <audio controls preload="none">
    <source src="song01.mp3" type="audio/mpeg">
  </audio>
</div>

</main>
</body>
</html>
